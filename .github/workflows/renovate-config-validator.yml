name: Renovate Config Validator

on: pull_request

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Validate Renovate config
        run: npx -p renovate --yes renovate-config-validator *.json
